pre-commit:
  parallel: true
  jobs:
    - run: bunx ultracite fix {staged_files}
      glob:
        - "*.js"
        - "*.jsx"
        - "*.mjs"
        - "*.cjs"
        - "*.ts"
        - "*.tsx"
        - "*.mts"
        - "*.cts"
        - "*.json"
        - "*.jsonc"
        - "*.css"
        - "*.scss"
        - "*.less"
        - "*.vue"
        - "*.svelte"
        - "*.astro"
        - "*.html"
        - "*.md"
        - "*.mdx"
        - "*.yaml"
        - "*.yml"
        - "*.graphql"
        - "*.gql"
      stage_fixed: true
    - run: bun fix {staged_files}
      glob: "**/*.{js,jsx,ts,tsx,json,jsonc,css}"

    - run: bunx v8r@3.1.0 {staged_files}
      glob: "**/*.{yml,yaml}"

    - run: bun typecheck
      glob: "**/*.{ts,tsx}"

    - run: bun run scripts/cleanup.ts
