name: CI

on:
  push:
    branches:
      - main
      - "init/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint & Format
        run: bun run check

  build:
    name: Build Verification
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Build
        run: bun run build

      - name: Bundle browser smoke fixture
        run: bun build scripts/browser-smoke.ts --target=node --outfile "$RUNNER_TEMP/browser-smoke.mjs"

      - name: Pack (dry-run)
        run: npm pack --dry-run

      - name: Setup minimum Node.js runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20.12.0"

      - name: Smoke test bundled CLI on minimum Node.js
        run: |
          node dist/index.mjs --help
          node dist/index.mjs search --help --guild 123
          node dist/index.cjs --help
          node "$RUNNER_TEMP/browser-smoke.mjs" | grep -F 'Browser smoke passed'

      - name: Setup minimum Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.0.31

      - name: Smoke test bundled CLI on minimum Bun
        run: |
          bun dist/index.mjs --help
          bun dist/index.mjs search --help --guild 123
          bun dist/index.mjs --version
          bun "$RUNNER_TEMP/browser-smoke.mjs" | grep -F 'Browser smoke passed'
          if output=$(bun dist/index.mjs search --guild 123 --limit invalid 2>&1); then
            exit 1
          fi
          printf '%s\n' "$output" | grep -F 'Invalid value for --limit'

  test-bun:
    name: Test with Bun
    needs: [check]
    strategy:
      matrix:
        bun-version: [1.4.4, canary]
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.bun-version == 'canary' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test
